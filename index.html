<!doctype html>
<!-- layout/CSS adapted with help from Cursor, then customized by hand -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, world</title>
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #1c1a17;
    --faded: #6d675d;
    --rule: #d6d0c4;
    --accent: #9c3b1b;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 "Iowan Old Style", "Hoefler Text", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  /* faint paper tooth so the flat color doesn't read as plastic */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .5;
    background-image: radial-gradient(var(--rule) .5px, transparent .5px);
    background-size: 4px 4px;
  }

  .sheet {
    position: relative;
    max-width: 62rem;
    min-height: 100%;
    margin: 0 auto;
    padding: 2.5rem 2rem 3rem;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: .9rem;
    border-bottom: 1px solid var(--rule);
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faded);
  }

  header b { font-weight: 600; color: var(--ink); }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(3rem, 12vh, 8rem) 0;
  }

  .kicker {
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.4rem;
  }

  .kicker::after {
    content: "";
    display: inline-block;
    width: 3.5rem;
    margin-left: .9rem;
    border-top: 1px solid var(--accent);
    vertical-align: .35em;
  }

  h1 {
    margin: 0;
    font-size: clamp(3.2rem, 13vw, 9rem);
    font-weight: 400;
    line-height: .92;
    letter-spacing: -.035em;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .lede {
    margin: 2rem 0 0;
    max-width: 34ch;
    font-size: 1.15rem;
    color: var(--faded);
  }

  footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-top: .9rem;
    border-top: 1px solid var(--rule);
    font-size: .72rem;
    letter-spacing: .08em;
    color: var(--faded);
  }

  footer a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
  }

  footer a:hover { border-bottom-color: var(--accent); color: var(--accent); }

  @media (max-width: 34rem) {
    header { font-size: .62rem; letter-spacing: .12em; }
    header span:last-child { display: none; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <b>SA1</b>
      <span>Assignment No.&nbsp;01</span>
      <span>Marty Coleman '27</span>
    </header>

    <main class="hero">
      <p class="kicker">First assignment</p>
      <h1>Hello,<br><em>world.</em></h1>
      <p class="lede">
        Hello CS52!
      </p>
    </main>

    <footer>
      <span>HTML &amp; CSS</span>
    </footer>
  </div>
</body>
</html>
